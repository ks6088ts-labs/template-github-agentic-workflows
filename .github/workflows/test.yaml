name: test

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "copilot/**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        platform:
          - "ubuntu-latest"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies (GitHub CLI extensions)
        shell: bash
        run: make install-deps-dev

      - name: Run CI tests
        shell: bash
        run: make ci-test
